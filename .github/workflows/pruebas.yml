name: Pruebas QA

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PERIOVISION_REFERENCIA: "0"   # el runner no es el equipo de referencia de RNF02 (prueba 83 omitida)
      YOLO_AUTOINSTALL: "false"
      YOLO_OFFLINE: "true"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Librerías del sistema (packages.txt)
        run: sudo apt-get update && xargs -a packages.txt sudo apt-get install -y
      - name: Dependencias fijadas (requirements.txt)
        run: pip install -r requirements.txt
      - name: Batería de pruebas
        run: python -m unittest discover -s pruebas -t . -v
